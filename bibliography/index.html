const cats=data.categories;
const allCatNames=Object.keys(cats);
let filterMode='any';
let activeCats=new Set(allCatNames);
function gid(x){return typeof x==='object'?x.id:x}
function uD(){nodes.forEach(n=>n.degree=0);links.forEach(l=>{nodes[gid(l.source)].degree++;nodes[gid(l.target)].degree++})}
uD();
const cc={};nodes.forEach(n=>{(n.all_categories||[n.category]).forEach(c=>{cc[c]=(cc[c]||0)+1})});
const ld=document.getElementById('li');
let legendEls={};
Object.entries(cc).sort((a,b)=>b[1]-a[1]).forEach(([c,n])=>{
const i=document.createElement('div');i.className='li';
const soloId='solo_'+c.replace(/[^a-z]/gi,'');
i.innerHTML='<div class="ld" style="background:'+(cats[c]||'#95a5a6')+'"></div><span style="font-size:11px">'+c+'</span><span class="lc">('+n+')</span><span class="solo-btn" id="'+soloId+'">only</span>';
i.onclick=function(e){
  if(e.target.classList.contains('solo-btn')){
    // Solo mode: show only this category
    activeCats=new Set([c]);
    Object.entries(legendEls).forEach(([k,el])=>{el.style.opacity=k===c?0.9:0.3});
  } else {
    if(activeCats.has(c))activeCats.delete(c);else activeCats.add(c);
    i.style.opacity=activeCats.has(c)?0.9:0.3;
  }
  uV();
};
legendEls[c]=i;
ld.appendChild(i)});

document.getElementById('btn-any').onclick=function(){filterMode='any';this.classList.add('active');document.getElementById('btn-primary').classList.remove('active');uV()};
document.getElementById('btn-primary').onclick=function(){filterMode='primary';this.classList.add('active');document.getElementById('btn-any').classList.remove('active');uV()};
document.getElementById('btn-all').onclick=function(){activeCats=new Set(allCatNames);Object.values(legendEls).forEach(el=>el.style.opacity=0.9);uV()};

const sim=d3.forceSimulation(nodes)
  .force('link',d3.forceLink(links).id(d=>d.id).distance(d=>d.weight>=2?60:120).strength(l=>l.weight*0.03))
  .force('charge',d3.forceManyBody().strength(-80))
  .force('center',d3.forceCenter(W/2,H/2))
  .force('collision',d3.forceCollide().radius(d=>Math.sqrt((d.degree||1)+1)*2+5))
  .force('x',d3.forceX(W/2).strength(0.03)).force('y',d3.forceY(H/2).strength(0.03));

let nE=nG.selectAll('circle').data(nodes).join('circle').attr('r',d=>Math.sqrt((d.degree||1)+1)*2+3).attr('fill',d=>d.color).attr('stroke','#151a28').attr('stroke-width',1.2).attr('opacity',0.88).call(d3.drag().on('start',(e,d)=>{if(!e.active)sim.alphaTarget(0.3).restart();d.fx=d.x;d.fy=d.y}).on('drag',(e,d)=>{d.fx=e.x;d.fy=e.y}).on('end',(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null}));
let tE=tG.selectAll('text').data(nodes).join('text').text(d=>d.label).attr('font-size',5).attr('fill','#8a95a5').attr('dx',d=>Math.sqrt((d.degree||1)+1)*2+5).attr('dy',3).attr('pointer-events','none');

function nmf(n){
  if(activeCats.size===allCatNames.length)return true;
  if(filterMode==='primary')return activeCats.has(n.category);
  return(n.all_categories||[n.category]).some(c=>activeCats.has(c));
}
function uV(){
  nE.attr('opacity',d=>nmf(d)?0.88:0.04);
  tE.attr('opacity',d=>nmf(d)?1:0.02);
  lE.attr('stroke-opacity',l=>{
    let s=typeof l.source==='object'?l.source:nodes[l.source];
    let t=typeof l.target==='object'?l.target:nodes[l.target];
    return nmf(s)&&nmf(t)?(l.weight>=2?0.35:0.15):0.005;
  });
}
